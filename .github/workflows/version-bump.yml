name: Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'xpeedlab-netizen'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.XPEEDLAB_NETIZEN_PAT }}

      - name: Bump patch version
        id: bump
        run: |
          NEW_VERSION=$(node -p "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const parts = pkg.version.split('.').map(Number);
            parts[2] += 1;
            pkg.version = parts.join('.');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            pkg.version;
          ")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync package-lock.json version
        run: |
          if [ -f package-lock.json ]; then
            node -e "
              const fs = require('fs');
              const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              const version = require('./package.json').version;
              lock.version = version;
              if (lock.packages && lock.packages['']) lock.packages[''].version = version;
              fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            "
          fi

      - name: Commit and push as xpeedlab-netizen
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          XPEEDLAB_NETIZEN_PAT: ${{ secrets.XPEEDLAB_NETIZEN_PAT }}
        run: |
          git config user.name "xpeedlab-netizen"
          git config user.email "xpeedlab-netizen@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git remote set-url origin "https://x-access-token:${XPEEDLAB_NETIZEN_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          git push origin "v$NEW_VERSION"
